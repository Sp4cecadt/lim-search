<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIM Search">
<meta name="robots" content="noindex, nofollow">
<title>LIM Search</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="sbband" aria-hidden="true"></div>
<header id="top">
  <div class="brand"><span class="logo">⚡</span> LIM Search <span id="ver" class="ver"></span></div>
  <form id="qform" class="searchbar" autocomplete="off" role="search">
    <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Search defects, codes, rules…" aria-label="Search the manual">
    <button type="button" id="mic" class="mic hdrbtn" aria-label="Open keyboard for dictation" title="Keyboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="ask" class="askbtn hdrbtn" aria-label="Ask Skynet" title="Ask Skynet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 5.2L19 10l-5.4 1.8L12 17l-1.6-5.2L5 10l5.4-1.8L12 3z" fill="currentColor"/><path d="M18.5 14.5l.7 2.2 2.3.8-2.3.8-.7 2.2-.7-2.2-2.3-.8 2.3-.8.7-2.2z" fill="currentColor" opacity=".85"/></svg>
    </button>
  </form>
  <div id="micmsg" class="micmsg" hidden></div>
  <div id="bgtask" class="micmsg small" hidden></div>
</header>
<main id="view"></main>
<nav id="tabs">
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.2 16.2L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="tl">Search</span></a>
  <a href="#/browse" data-tab="browse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="tl">Browse</span></a>
  <a href="#/cheat" data-tab="cheat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20l2.2-6.5L4 10h5.2L12 3l2.8 7H20l-3.2 3.5L19 20l-7-3.8L5 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="tl">Priorities</span></a>
  <a href="#/manual" data-tab="manual"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 16.5v-11z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 16.5A2.5 2.5 0 016.5 19H20" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="tl">Manual</span></a>
</nav>
<div id="modal" class="modal" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
