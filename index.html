<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>LIM Search</title>

<body>
<div id="sbband" aria-hidden="true"></div>
<header id="top">
  <div class="brand"><span class="logo">⚡</span> LIM Search <span id="ver" class="ver"></span></div>
  <form id="qform" class="searchbar" autocomplete="off" role="search">
    <div class="qwrap">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Search defects, codes, rules…" aria-label="Search the manual">
      <button type="button" id="qclear" class="qclear" aria-label="Clear search" title="Clear" hidden><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 5l12 12M17 5l-12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <button type="button" id="mic" class="mic hdrbtn" aria-label="Show keyboard" title="Show keyboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="ask" class="askbtn hdrbtn" aria-label="Ask Skynet" title="Ask Skynet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#3b82f6" d="M7.2 18.5h9.6c2.4 0 4.4-1.9 4.4-4.3 0-2.1-1.5-3.8-3.5-4.2.1-.3.1-.6.1-.9C17.8 6.4 15.5 4.2 12.6 4.2c-2.2 0-4.1 1.3-5 3.2C6.8 7.1 5.9 6.8 5 6.8 2.9 6.8 1.2 8.5 1.2 10.6c0 .4.1.8.2 1.1C.5 12.2 0 13.3 0 14.5c0 2.2 1.8 4 4 4h3.2z"/></svg>
    </button>
  </form>
  <div id="micmsg" class="micmsg" hidden></div>
  <div id="bgtask" class="micmsg small" hidden></div>
</header>
<main id="view"></main>
<nav id="tabs">
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.2 16.2L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="tl">Search</span></a>
  <a href="#/browse" data-tab="browse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="tl">Browse</span></a>
  <a href="#/docs" data-tab="docs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 016.5 3H14l5 5v11.5a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 015 19.5v-15z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="tl">Docs</span></a>
  <a href="#/manual" data-tab="manual"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tl">Settings</span></a>
